---
# Three cases the check could not tell apart before. The first two give the
# destination an address that fails inside the kernel on the sending node, so
# they must name the sending node instead of blaming the network, which is what
# the earlier version did. The third is the fault the check exists for and must
# still be reported as such.
#
#   case=partial  the list is [fe80::1, 127.0.0.1]. Only the first address
#                 fails. k3s would hand both to flannel, so the round must still
#                 fail, and the message must name fe80::1 and not 127.0.0.1.
#                 That the second address was written to anyway is covered by
#                 tests/test_udp_probe.py.
#   case=total    the list is [fe80::1] alone. No datagram can leave the sender
#                 at all.
#   case=blocked  the list is [192.0.2.1], reserved by RFC 5737 and routed
#                 nowhere. The sender writes it without error, so the sender is
#                 healthy and the token never arrives. This must produce the
#                 BLOCKED message, not a sender fault.
- name: Sender failures are reported as sender failures
  hosts: k3s_nodes
  gather_facts: false
  vars:
    case: partial
    ip_family: "{{ {'partial': 'dual', 'total': 'ipv6', 'blocked': 'ipv4'}[case] }}"
    ip_family_primary: "{{ 'ipv4' if case == 'blocked' else 'ipv6' }}"
    k3s_cluster_cidr_ipv4: 10.42.0.0/16
    k3s_cluster_cidr_ipv6: fd00:42::/56
    k3s_service_cidr_ipv4: 10.43.0.0/16
    k3s_service_cidr_ipv6: fd00:43::/112
    k3s_node_external_ip: ""
    k3s_extra_exec_args: ""
    k3s_role: server
    longhorn_enabled: false
    longhorn_default_storage_class: false
    preflight_connectivity_check: true
    preflight_overlay_port: 48475
    preflight_probe_duration: 5

  pre_tasks:
    - name: Give the destination an address the sender cannot deliver to
      ansible.builtin.set_fact:
        ansible_facts:
          default_ipv4: "{{ _ipv4_by_case[case] }}"
          default_ipv6: "{{ {} if case == 'blocked' else {'address': 'fe80::1'} }}"
      vars:
        _ipv4_by_case:
          partial: {address: 127.0.0.1}
          total: {}
          blocked: {address: 192.0.2.1}
      tags: [always]

  tasks:
    - name: Run role tasks # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      tags: [always]
