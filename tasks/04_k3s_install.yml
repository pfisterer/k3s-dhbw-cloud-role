---
# ── SERVER INSTALL ─────────────────────────────────────────────────────────────
- name: K3s server installation
  when: k3s_role == 'server'
  become: true
  vars:
    # Use the explicit override when set, otherwise the args computed in 03_network.yml.
    _k3s_server_exec_args: "{{ k3s_exec_args if (k3s_exec_args | length > 0) else _k3s_exec_args }}"
    kubeconfig_url: "{{ _kubeconfig_url }}"
  block:
    - name: Install K3s server
      ansible.builtin.shell:
        cmd: "curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='{{ _k3s_server_exec_args }}' sh -"
        creates: /usr/local/bin/k3s
      tags:
        - skip_ansible_lint

    - name: Wait for K3s kubeconfig to appear
      ansible.builtin.wait_for:
        path: "{{ kubeconfig_root }}"
        timeout: 180

    # The kubeconfig on the host is left exactly as k3s writes it. k3s rewrites
    # it on every start, pointed at the loopback address, so patching it in
    # place (as this role did until 2026.08.28) was undone by the next restart
    # and reported "changed" on every run thereafter — a permanent diff that
    # meant nothing, since loopback works on the host anyway. Only the copy on
    # the control node needs the reachable address, so the rewrite happens
    # there, on the way through.
    - name: Read the kubeconfig from the server
      ansible.builtin.slurp:
        src: "{{ kubeconfig_root }}"
      register: _k3s_kubeconfig

    - name: Write the kubeconfig to the control node, pointed at the reachable address
      vars:
        # k3s writes the IPv4 loopback (127.0.0.1) or the IPv6 loopback ([::1])
        # depending on the stack, so match both. Kept out of the Jinja
        # expression: Ansible does not unescape backslashes in Jinja string
        # literals, which turns a `\1` there into a literal backslash-one.
        _loopback_server: '^(\s*server:\s+)https://(127\.0\.0\.1|\[::1\]):6443$'
        _reachable_server: '\g<1>{{ kubeconfig_url }}'
      ansible.builtin.copy:
        content: "{{ _k3s_kubeconfig.content | b64decode | regex_replace(_loopback_server, _reachable_server, multiline=true) }}"
        # kubeconfig_path overrides the default name when set. Sanitize ':' so IPv6
        # inventory host names still yield filesystem-friendly default paths.
        dest: "{{ kubeconfig_path if (kubeconfig_path | length > 0) else './kubeconfig-' + (inventory_hostname | replace(':', '_')) + '.yaml' }}"
        # A credential: owner-only, like k3s keeps its own copy.
        mode: "0600"
      delegate_to: localhost
      become: false

    # Readiness gate before the add-ons (which need a working pod network):
    # k3s' built-in flannel brings the node Ready on its own, so wait for it here.
    - name: Wait for the server node to become Ready
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/kubectl get nodes --no-headers \
          | awk '$2 == "Ready" { ready++ } END { exit (ready > 0) ? 0 : 1 }'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: _flannel_node_ready
      until: _flannel_node_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      tags:
        - skip_ansible_lint

# ── AGENT INSTALL ──────────────────────────────────────────────────────────────
- name: K3s agent installation
  when: k3s_role == 'agent'
  become: true
  block:
    - name: Validate required agent variables
      ansible.builtin.assert:
        that:
          - k3s_server_host | length > 0
        fail_msg: >
          k3s_role is 'agent' but k3s_server_host is not set.
          Set k3s_server_host as a group_var on the agent host group.

    # Wait for the server to finish writing the token before reading it.
    # This naturally handles the race when servers and agents run in the same play.
    - name: Wait for server join token to be available
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 300
      delegate_to: "{{ k3s_server_host | default(inventory_hostname, true) }}"

    - name: Read join token from server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ k3s_server_host | default(inventory_hostname, true) }}"
      register: k3s_token_slurp

    - name: Install K3s agent and join cluster
      ansible.builtin.shell:
        cmd: "curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='{{ _k3s_agent_exec_args }}' sh -s - agent"
        creates: /usr/local/bin/k3s
      environment:
        # Bracket IPv6 server addresses for the join URL.
        K3S_URL: "https://{{ ('[' + k3s_server_host + ']') if ':' in k3s_server_host else k3s_server_host }}:6443"
        K3S_TOKEN: "{{ k3s_token_slurp['content'] | b64decode | trim }}"
      tags:
        - skip_ansible_lint

    - name: Wait for k3s agent service to be active
      ansible.builtin.systemd:
        name: k3s-agent
      register: k3s_agent_service
      until: k3s_agent_service.status.ActiveState == 'active'
      retries: 24
      delay: 5
