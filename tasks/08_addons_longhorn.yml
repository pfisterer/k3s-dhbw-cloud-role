---
# --- Longhorn distributed block storage (installed only when longhorn_enabled) ---
# Node prerequisites (open-iscsi, nfs-common, iscsid, iscsi_tcp) are installed on
# every node in 02_bootstrap.yml; this file only deploys the cluster components.
- name: Longhorn deployment
  when: longhorn_enabled | bool
  become: true
  block:
    # Validate the replica count against the *actual* cluster size before installing.
    # By this point (after 04_k3s_install) all agents in this run have joined, so the
    # node list reflects the real cluster. Abort early on a nonsensical setting rather
    # than installing Longhorn with replicas that can never be scheduled.
    - name: Get cluster node count
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ kubeconfig_root }}"
      register: _cluster_nodes

    - name: Validate longhorn_replica_count fits the cluster
      ansible.builtin.assert:
        that:
          - longhorn_replica_count | int >= 1
          - longhorn_replica_count | int <= (_cluster_nodes.resources | length)
        fail_msg: >-
          longhorn_replica_count={{ longhorn_replica_count }} is invalid for a cluster
          with {{ _cluster_nodes.resources | length }} node(s). It must be between 1
          and the number of nodes — otherwise replicas can never be scheduled and
          volumes stay permanently "Degraded". Lower longhorn_replica_count or add nodes.
        success_msg: >-
          longhorn_replica_count={{ longhorn_replica_count }} OK for
          {{ _cluster_nodes.resources | length }} node(s).

    - name: Ensure longhorn namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ longhorn_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"

    - name: Install or upgrade Longhorn
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        chart_version: "{{ longhorn_version or omit }}"
        release_namespace: "{{ longhorn_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        values:
          # Chart default is an empty mapping, so an unset variable changes nothing.
          global:
            nodeSelector: "{{ longhorn_node_selector }}"
          persistence:
            defaultClass: "{{ longhorn_default_storage_class | bool }}"
            defaultClassReplicaCount: "{{ longhorn_replica_count | int }}"
            # dataLocality parameter of the "longhorn" StorageClass, i.e. what every
            # PVC created through it gets. StorageClass parameters are immutable, but
            # Longhorn ships the class in the longhorn-storageclass ConfigMap and
            # re-applies it itself, so changing this does propagate on a helm upgrade
            # -- to NEW volumes only. Existing volumes keep the locality in their spec.
            defaultDataLocality: "{{ longhorn_data_locality }}"
          defaultSettings:
            # Longhorn separates key and value with a colon here, not with an
            # equals sign, and joins several labels with a semicolon. omit keeps
            # the key out of the values when the variable is empty.
            systemManagedComponentsNodeSelector: >-
              {{ (longhorn_node_selector | dict2items | map(attribute='key')
                  | zip(longhorn_node_selector | dict2items | map(attribute='value'))
                  | map('join', ':') | join(';'))
                 if longhorn_node_selector else omit }}
            defaultReplicaCount: "{{ longhorn_replica_count | int }}"
            # Same locality default for volumes created outside the StorageClass.
            defaultDataLocality: "{{ longhorn_data_locality }}"
            # Spread replicas across nodes so no single node ends up holding several
            # "last replicas" (which would each block a drain during a rolling upgrade).
            replicaAutoBalance: "{{ longhorn_replica_auto_balance }}"
            # Live-migrate the last replica off a node before allowing it to be drained,
            # so the role's automatic rolling k3s upgrades never hang on a single-replica
            # volume (the chart default block-if-contains-last-replica blocks forever).
            nodeDrainPolicy: "{{ longhorn_node_drain_policy }}"
            # Allow reserving more than the raw disk size (thin-provisioned volumes).
            # Needed so storage-hungry labs (e.g. Apache Ozone) can schedule their
            # replicas on the small lab VMs. See longhorn_storage_over_provisioning_percentage.
            storageOverProvisioningPercentage: "{{ longhorn_storage_over_provisioning_percentage | int }}"
            # Let Longhorn garbage-collect orphaned replica data and engine/replica
            # instances instead of leaving them for manual cleanup. See the two
            # longhorn_orphan_resource_auto_deletion* variables for the caveats.
            orphanResourceAutoDeletion: "{{ longhorn_orphan_resource_auto_deletion }}"
            orphanResourceAutoDeletionGracePeriod: "{{ longhorn_orphan_resource_auto_deletion_grace_period | int }}"
        wait: true
        # Longhorn pulls several images and rolls out CRDs + DaemonSets, so give it
        # more time than the module default. Deliberately NOT atomic: a failed
        # Longhorn install/rollback can hang on its CRD finalizers and need manual
        # cleanup; `state: present` (helm upgrade -i) reconverges on the next run.
        wait_timeout: "10m0s"
