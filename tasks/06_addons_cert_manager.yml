---
# --- Cert Manager (installed only when cert_manager_email is defined and not empty)
- name: Addons Deployment
  when: cert_manager_email is defined and cert_manager_email != ""
  become: true
  block:
    # --- Fail fast on a malformed address. The block guard above only checks
    # that cert_manager_email is non-empty; a non-empty but invalid value (e.g.
    # a users.dhbw.site DNS name pasted in instead of a real address, which has
    # no "@") would still render a ClusterIssuer whose ACME newAccount is
    # rejected upstream with "400 invalidContact" — cert-manager then retries
    # that account registration forever. Assert a basic mailbox shape here so
    # provisioning fails loudly instead of shipping a broken, looping issuer.
    - name: Validate cert_manager_email is a well-formed address
      ansible.builtin.assert:
        that:
          # `is match` rather than `| regex_search`: the filter returns the
          # matched string (or none), and since ansible-core 2.19 a conditional
          # that resolves to a non-boolean is a hard error —
          # "Conditional result (True) was derived from value of type 'str'".
          # The `match` test anchors at the start like re.match, so the leading
          # ^ is redundant but kept for readability.
          - cert_manager_email is match('^\S+@\S+\.\S+$')
        fail_msg: >-
          cert_manager_email '{{ cert_manager_email }}' is not a valid email
          address (needs a mailbox@domain.tld form). cert-manager would create a
          ClusterIssuer that loops on '400 invalidContact' against
          {{ cert_manager_url }}. Set a real address, or leave it empty to skip
          cert-manager entirely.
        quiet: true

    # --- Namespace
    - name: Ensure cert-manager namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cert_manager_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"

    # --- Install helm chart
    - name: Install or upgrade Cert-Manager
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        # See defaults/main.yml: pinned so a run does not silently upgrade the
        # component that issues the wildcard certificate.
        chart_version: "{{ cert_manager_chart_version }}"
        release_namespace: "{{ cert_manager_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        values:
          installCRDs: true
        wait: true
        atomic: true

    # --- EAB secret (if required)
    - name: EAB secret
      when: cert_manager_eab_keyid != "" and cert_manager_eab_secret != ""
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cert_manager_eab_secret_name }}"
            namespace: "{{ cert_manager_namespace }}"
          type: Opaque
          data:
            secret: "{{ cert_manager_eab_secret | b64encode }}"

    # --- TSIG secret for the DNS-01 (RFC2136) solver. data.secret holds the TSIG
    # key base64-encoded (k8s stores it verbatim; cert-manager base64-decodes it
    # back to the same value external-dns gets). Using `data` (not `stringData`)
    # keeps the task idempotent. Created only for dns01 — http01 needs no creds.
    - name: Create RFC2136 TSIG secret for the cert-manager DNS-01 solver
      when:
        - cert_manager_preferred_challenge == 'dns01'
        - rfc2136_tsig_secret_value | default('') | length > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cert_manager_rfc2136_tsig_secret_name }}"
            namespace: "{{ cert_manager_namespace }}"
          type: Opaque
          data:
            secret: "{{ rfc2136_tsig_secret_value | b64encode }}"

    # --- ClusterIssuer
    - name: Render ClusterIssuer template
      ansible.builtin.template:
        src: cluster_issuer.yaml.j2
        dest: /tmp/cluster_issuer.yaml
        mode: "0600"
      # Renders in `--check` too. Without it the apply task below finds no file
      # and the run stops there — which put `--tags certmanager --check --diff`
      # out of reach, i.e. the one check a consumer wants before letting this
      # role near a production ClusterIssuer or wildcard certificate.
      #
      # A deliberate exception to check-mode semantics, kept narrow: /tmp is
      # scratch, the file is only an input to the next task, and it is rewritten
      # every run. Nothing in the cluster is touched here — the apply task still
      # honours --check.
      #
      # changed_when: false so a check run's "changed" count keeps meaning
      # "would change something in the cluster".
      check_mode: false
      changed_when: false

    - name: Apply cert-manager ClusterIssuer for Let's Encrypt Production
      kubernetes.core.k8s:
        src: /tmp/cluster_issuer.yaml
        kubeconfig: "{{ kubeconfig_root }}"
        state: present

    # --- Wildcard certificate. Requested whenever a wildcard zone is configured
    # — by default that is the RFC2136 zone while dns01 is active, and otherwise
    # whatever cert_manager_wildcard_zone names (see defaults/main.yml, which
    # also documents why forcing this under http01 does not work). One cert for
    # "*.<zone>" plus any cert_manager_wildcard_additional_dns_names replaces the
    # per-host certs; cert-manager stores cert+key in a TLS Secret in the Traefik
    # namespace.
    # Parentheses matter: a Jinja filter binds tighter than `+`, so without them
    # join() would be applied to the additional names alone and then added to a
    # list — a type error rather than a string.
    - name: Request wildcard certificate ({{ (['*.' ~ cert_manager_wildcard_zone] + cert_manager_wildcard_additional_dns_names) | join(', ') }})
      when: &wildcard_active
        - cert_manager_wildcard_zone | default('') | length > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ cert_manager_wildcard_secret_name }}"
            namespace: "{{ traefik_namespace }}"
          spec:
            secretName: "{{ cert_manager_wildcard_secret_name }}"
            # Primary SAN first: it is the one derived from the zone, and the
            # order is what keeps an existing certificate from being reissued.
            dnsNames: "{{ ['*.' ~ cert_manager_wildcard_zone] + cert_manager_wildcard_additional_dns_names }}"
            issuerRef:
              name: "{{ cert_manager_cluster_issuer_name }}"
              kind: ClusterIssuer

    # --- Traefik default TLS store. Traefik serves this certificate for any
    # HTTPS host whose SNI has no more-specific certificate, so Ingresses need
    # not reference a TLS Secret at all. Must be named "default" and live in the
    # Traefik namespace alongside the wildcard Secret. Same condition as the
    # certificate above: a TLS store pointing at a Secret nobody fills would
    # make Traefik serve its self-signed default instead.
    - name: Register wildcard certificate as the Traefik default TLS store
      when: *wildcard_active
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: TLSStore
          metadata:
            name: default
            namespace: "{{ traefik_namespace }}"
          spec:
            defaultCertificate:
              secretName: "{{ cert_manager_wildcard_secret_name }}"
