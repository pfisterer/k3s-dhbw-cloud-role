---
# --- Cert Manager (installed only when cert_manager_email is defined and not empty)
- name: Addons Deployment
  when: cert_manager_email is defined and cert_manager_email != ""
  become: true
  block:
    # --- Namespace
    - name: Ensure cert-manager namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cert_manager_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"

    # --- Install helm chart
    - name: Install or upgrade Cert-Manager
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: "{{ cert_manager_namespace }}"
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        values:
          installCRDs: true
        wait: true
        atomic: true

    # --- EAB secret (if required)
    - name: EAB secret
      when: cert_manager_eab_keyid != "" and cert_manager_eab_secret != ""
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cert_manager_eab_secret_name }}"
            namespace: "{{ cert_manager_namespace }}"
          type: Opaque
          data:
            secret: "{{ cert_manager_eab_secret | b64encode }}"

    # --- TSIG secret for the DNS-01 (RFC2136) solver. data.secret holds the TSIG
    # key base64-encoded (k8s stores it verbatim; cert-manager base64-decodes it
    # back to the same value external-dns gets). Using `data` (not `stringData`)
    # keeps the task idempotent. Created only for dns01 — http01 needs no creds.
    - name: Create RFC2136 TSIG secret for the cert-manager DNS-01 solver
      when:
        - cert_manager_preferred_challenge == 'dns01'
        - rfc2136_tsig_secret_value | default('') | length > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ cert_manager_rfc2136_tsig_secret_name }}"
            namespace: "{{ cert_manager_namespace }}"
          type: Opaque
          data:
            secret: "{{ rfc2136_tsig_secret_value | b64encode }}"

    # --- ClusterIssuer
    - name: Render ClusterIssuer template
      ansible.builtin.template:
        src: cluster_issuer.yaml.j2
        dest: /tmp/cluster_issuer.yaml
        mode: "0600"

    - name: Apply cert-manager ClusterIssuer for Let's Encrypt Production
      kubernetes.core.k8s:
        src: /tmp/cluster_issuer.yaml
        kubeconfig: "{{ kubeconfig_root }}"
        state: present

    # --- Wildcard certificate. Whenever dns01 is the active challenge (a zone and
    # TSIG key are set — the same condition under which the ClusterIssuer uses the
    # dns01 solver) the role issues one wildcard cert covering *.<rfc2136_zone>,
    # replacing the per-host certs. cert-manager stores the cert+key in a TLS
    # Secret in the Traefik namespace. A wildcard cannot be validated via http01.
    - name: Request wildcard certificate via the DNS-01 solver
      when: &wildcard_active
        - cert_manager_preferred_challenge == 'dns01'
        - rfc2136_zone | default('') | length > 0
        - rfc2136_tsig_secret_value | default('') | length > 0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ cert_manager_wildcard_secret_name }}"
            namespace: "{{ traefik_namespace }}"
          spec:
            secretName: "{{ cert_manager_wildcard_secret_name }}"
            dnsNames:
              - "*.{{ rfc2136_zone }}"
            issuerRef:
              name: "{{ cert_manager_cluster_issuer_name }}"
              kind: ClusterIssuer

    # --- Traefik default TLS store. Traefik serves this certificate for any
    # HTTPS host whose SNI has no more-specific certificate, so Ingresses need
    # not reference a TLS Secret at all. Must be named "default" and live in the
    # Traefik namespace alongside the wildcard Secret.
    - name: Register wildcard certificate as the Traefik default TLS store
      when: *wildcard_active
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_root }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: TLSStore
          metadata:
            name: default
            namespace: "{{ traefik_namespace }}"
          spec:
            defaultCertificate:
              secretName: "{{ cert_manager_wildcard_secret_name }}"
