---
# Base packages needed on every node (curl is used by the k3s install script).
- name: Ensure base apt packages are installed
  become: true
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true
    cache_valid_time: 86400

# ─────────────────────────────────────────────────────────────────────────────
# Client / developer tooling (Helm, kubectl, Skaffold, aliases, completions).
# Only meaningful on the server node — agents have no kubeconfig — so install it
# there and only when bootstrap_install_client_tools is enabled. python3-kubernetes
# (used by the kubernetes.core/helm modules) is likewise only needed on the server.
# ─────────────────────────────────────────────────────────────────────────────
- name: Install client/developer tooling on the server node
  become: true
  when:
    - k3s_role == 'server'
    - bootstrap_install_client_tools | bool
  block:
    - name: Ensure python3-kubernetes is installed (for Ansible k8s/helm modules)
      ansible.builtin.apt:
        name:
          - python3-kubernetes
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Ensure Helm is installed
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
          | {{ ('DESIRED_VERSION=' ~ helm_version ~ ' ') if (helm_version | length > 0) else '' }}bash
      args:
        executable: /bin/bash
        creates: /usr/local/bin/helm
      tags:
        - skip_ansible_lint
        - "ansible-lint:command-instead-of-shell"

    - name: Ensure Skaffold is installed
      ansible.builtin.shell: |
        curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/{{ skaffold_version }}/skaffold-linux-amd64 && \
        install skaffold /usr/local/bin/ && \
        rm skaffold
      args:
        executable: /bin/bash
        creates: /usr/local/bin/skaffold
      tags:
        - skip_ansible_lint

    - name: Ensure kubectl is installed
      ansible.builtin.shell: |
        VERSION="{{ kubectl_version }}"
        if [ -z "$VERSION" ]; then VERSION="$(curl -Ls https://dl.k8s.io/release/stable.txt)"; fi
        curl -LO "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl" && \
        install -m 755 kubectl /usr/local/bin/kubectl && \
        rm kubectl
      args:
        executable: /bin/bash
        creates: /usr/local/bin/kubectl
      tags:
        - skip_ansible_lint

    # Shell Enhancements (Aliases und Completion)
    - name: Ensure 'k' alias for 'kubectl' is configured system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_alias.sh
        content: |
          alias k='/usr/local/bin/kubectl'
        owner: root
        group: root
        mode: "0755"

    - name: Ensure 'watch' alias is configured to enable recursive alias expansion system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/watch_alias.sh
        content: |
          alias watch='watch '
        owner: root
        group: root
        mode: "0755"

    - name: Ensure KUBECONFIG variable is set system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: |
          export KUBECONFIG={{ kubeconfig_root }}
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Helm bash completion is configured system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/helm_completion.sh
        content: |
          if [ -x /usr/local/bin/helm ]; then
            source <(/usr/local/bin/helm completion bash)
          fi
        owner: root
        group: root
        mode: "0755"

    - name: Ensure kubectl bash completion is configured system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_completion.sh
        content: |
          if [ -x /usr/local/bin/kubectl ]; then
            source <(/usr/local/bin/kubectl completion bash)
          fi
        owner: root
        group: root
        mode: "0755"

    - name: Ensure code completion for 'k' alias system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/kubectl_k_completion.sh
        content: |
          complete -F __start_kubectl k
        owner: root
        group: root
        mode: "0755"

# /etc/profile.d/*.sh is only read by login shells. Interactive non-login shells
# (e.g. `sudo bash`) read /etc/bash.bashrc, so source the profile.d snippets there
# too — this makes the k/l aliases, KUBECONFIG and completions available as well.
- name: Load /etc/profile.d snippets in interactive non-login bash shells
  become: true
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED: source /etc/profile.d for non-login shells"
    block: |
      if [ -d /etc/profile.d ]; then
        for _pd in /etc/profile.d/*.sh; do
          [ -r "$_pd" ] && . "$_pd"
        done
        unset _pd
      fi

# -----------------------------------------
# Longhorn node prerequisites (all nodes)
# -----------------------------------------
# Longhorn attaches volumes via iSCSI on every node and uses NFS for RWX volumes,
# so open-iscsi (+ running iscsid) and nfs-common must be present cluster-wide —
# agents included. Only installed when Longhorn is enabled.
- name: Install Longhorn node prerequisites
  become: true
  when: longhorn_enabled | bool
  block:
    - name: Ensure open-iscsi and nfs-common are installed
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Persist iscsi_tcp kernel module load
      ansible.builtin.copy:
        dest: /etc/modules-load.d/longhorn.conf
        content: |
          iscsi_tcp
        owner: root
        group: root
        mode: "0644"

    - name: Ensure iscsi_tcp kernel module is loaded
      ansible.builtin.command:
        cmd: modprobe iscsi_tcp
      register: _iscsi_tcp_modprobe
      changed_when: false
      failed_when: _iscsi_tcp_modprobe.rc != 0

    - name: Ensure iscsid service is enabled and running
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    # Ubuntu's ubuntu-server metapackage pulls in multipath-tools, so multipathd runs
    # on every node whether or not there is multipath hardware. It claims the /dev/sd*
    # devices Longhorn attaches over iSCSI, and when it wins that race the volume fails
    # to mount ("MountVolume.SetUp failed for volume"). Blacklisting those devnodes is
    # Longhorn's documented fix: https://longhorn.io/kb/troubleshooting-volume-with-multipath/
    # Safe on cloud VMs whose root disk is virtio (/dev/vda): sd* is then exclusively
    # Longhorn's iSCSI attachments. Review this on nodes with real SCSI/SAS disks.
    - name: Gather service facts (to detect multipathd)
      ansible.builtin.service_facts:

    # multipathd's default config_dir. Present in multipath.conf(5) but not created by
    # the Ubuntu package, so create it rather than editing the distro's multipath.conf.
    - name: Ensure the multipathd drop-in directory exists
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: "'multipathd.service' in (ansible_facts.services | default({}))"

    - name: Keep multipathd away from Longhorn's iSCSI devices
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/longhorn.conf
        content: |
          # Managed by k3s-dhbw-cloud-role -- do not edit.
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
        owner: root
        group: root
        mode: "0644"
      register: _longhorn_multipath_blacklist
      when: "'multipathd.service' in (ansible_facts.services | default({}))"

    # Deliberately not a handler: handlers flush at the end of the play, i.e. after
    # 08_addons_longhorn.yml has already installed Longhorn in the same run. The
    # blacklist has to be live before the first volume is attached.
    - name: Restart multipathd to apply the blacklist # noqa: no-handler
      ansible.builtin.systemd:
        name: multipathd
        state: restarted
      when: _longhorn_multipath_blacklist is changed

# -----------------------------------------
# Kernel tuning for k3s
# -----------------------------------------
# The net.netfilter.nf_conntrack_* sysctls only exist once the nf_conntrack
# kernel module is loaded; load and persist it first so the sysctl reload below
# does not fail with "cannot stat /proc/sys/net/netfilter/nf_conntrack_max".
- name: Persist nf_conntrack kernel module load
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      nf_conntrack
    owner: root
    group: root
    mode: "0644"

- name: Ensure nf_conntrack kernel module is loaded
  become: true
  ansible.builtin.command:
    cmd: modprobe nf_conntrack
  register: _nf_conntrack_modprobe
  changed_when: false
  failed_when: _nf_conntrack_modprobe.rc != 0

# Manage the sysctls as ONE file + reload-on-change instead of the
# ansible.posix.sysctl module: that module falsely reports "changed" every run
# for net.netfilter.* keys (even when file+runtime value already match), which
# broke idempotency. copy() only changes on real content diffs; the reload runs
# only when the file changed and is changed_when:false so it never counts.
- name: Deploy k3s kernel-tuning sysctls
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by k3s-dhbw-cloud-role — applied at boot and on change below.
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
      net.netfilter.nf_conntrack_max = 524288
      net.netfilter.nf_conntrack_tcp_timeout_established = 86400
      kernel.pid_max = 131072
      fs.file-max = 2097152
      vm.swappiness = 0
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
      net.ipv6.conf.default.forwarding = 1
      net.ipv4.ip_local_port_range = 1024 65535
      vm.max_map_count = 262144
  register: _k3s_sysctl_file

- name: Apply k3s sysctls when the file changed # noqa: no-handler
  become: true
  ansible.builtin.command:
    cmd: sysctl --system
  when: _k3s_sysctl_file is changed
  changed_when: false
