---
# ── SERVER INSTALL ─────────────────────────────────────────────────────────────
- name: K3s server installation
  when: k3s_role == 'server'
  vars:
    k3s_node_ip: >-
      {% if ip_family == 'ipv4' %}
      {{ ansible_facts['default_ipv4']['address'] }}
      {% elif ip_family == 'ipv6' %}
      {{ ansible_facts['default_ipv6']['address'] }}
      {% endif %}
    kubeconfig_url: >-
      {% if ip_family == 'ipv4' %}
      https://{{ ansible_facts['default_ipv4']['address'] }}:6443
      {% elif ip_family == 'ipv6' %}
      https://[{{ ansible_facts['default_ipv6']['address'] }}]:6443
      {% endif %}
  block:
    - name: Install K3s server
      ansible.builtin.shell:
        cmd: "curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='{{ k3s_exec_args }}' sh -"
        creates: /usr/local/bin/k3s
      tags:
        - skip_ansible_lint

    - name: Wait for K3s kubeconfig to appear
      ansible.builtin.wait_for:
        path: "{{ kubeconfig_root }}"
        timeout: 180

    - name: Replace localhost with actual node IP in kubeconfig
      ansible.builtin.replace:
        path: "{{ kubeconfig_root }}"
        regexp: '^(\s*server:\s+)https://127\.0\.0\.1:6443'
        replace: '\1{{ kubeconfig_url }}'

    - name: Copy kubeconfig to localhost
      ansible.builtin.fetch:
        src: "{{ kubeconfig_root }}"
        dest: "./kubeconfig-{{ inventory_hostname }}.yaml"
        flat: true

    - name: Wait for node to be ready
      ansible.builtin.shell: /usr/local/bin/kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_root }}"
      register: kubectl_check
      until: kubectl_check.rc == 0 and 'Ready' in kubectl_check.stdout
      retries: 24
      delay: 5
      changed_when: false
      tags:
        - skip_ansible_lint

# ── AGENT INSTALL ──────────────────────────────────────────────────────────────
- name: K3s agent installation
  when: k3s_role == 'agent'
  block:
    - name: Validate required agent variables
      ansible.builtin.assert:
        that:
          - k3s_server_host | length > 0
        fail_msg: >
          k3s_role is 'agent' but k3s_server_host is not set.
          Set k3s_server_host as a group_var on the agent host group.

    # Wait for the server to finish writing the token before reading it.
    # This naturally handles the race when servers and agents run in the same play.
    - name: Wait for server join token to be available
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 300
      delegate_to: "{{ k3s_server_host }}"

    - name: Read join token from server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ k3s_server_host }}"
      register: k3s_token_slurp

    - name: Install K3s agent and join cluster
      ansible.builtin.shell:
        cmd: "curl -sfL https://get.k3s.io | sh -s - agent"
        creates: /usr/local/bin/k3s
      environment:
        K3S_URL: "https://{{ k3s_server_host }}:6443"
        K3S_TOKEN: "{{ k3s_token_slurp['content'] | b64decode | trim }}"
      tags:
        - skip_ansible_lint

    - name: Wait for k3s agent service to be active
      ansible.builtin.systemd:
        name: k3s-agent
      register: k3s_agent_service
      until: k3s_agent_service.status.ActiveState == 'active'
      retries: 24
      delay: 5
