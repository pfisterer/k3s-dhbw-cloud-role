---
# --- Ingress-NGINX Controller Deployment via Helm ---
- name: Ensure ingress-nginx namespace exists
  become: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ingress-nginx
    kubeconfig: "{{ kubeconfig_root }}"

- name: Install or upgrade NGINX Ingress Controller
  become: true
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    release_namespace: ingress-nginx
    kubeconfig: "{{ kubeconfig_root }}"
    state: present
    values:
      controller:
        service:
          type: LoadBalancer
          ipFamilyPolicy: "{{ 'PreferDualStack' if ip_family == 'dual' else 'SingleStack' }}"
          ipFamilies: "{{ _ip_families_ordered | map('extract', {'ipv4': 'IPv4', 'ipv6': 'IPv6'}) | list }}"
        watchIngressWithoutClass: true
        config:
          strict-validate-path-type: false
    wait: true
    atomic: true
