# -----------------------------------------------------------------------------
## 🌟 General & Network Settings
# -----------------------------------------------------------------------------
# The IP stack to configure the cluster for:
#   auto → detect from the host's default-route addresses (default):
#          both families present → dual, only IPv6 → ipv6, otherwise ipv4
#   ipv4 → IPv4 single-stack
#   ipv6 → IPv6 single-stack
#   dual → dual-stack (both families)
# Determines which addresses are used for TLS SANs, the kubeconfig URL, k3s
# --node-ip and the pod/service CIDRs. Set an explicit value to override the
# auto-detection (e.g. force ipv6 on a host that also has a private IPv4).
ip_family: "auto"

# Only relevant when ip_family resolves to "dual": which family is the *primary*.
# The primary family is listed first in --cluster-cidr/--service-cidr/--node-ip
# (k3s uses the first entry as the cluster's primary family).
#   auto → the family Ansible connects over (default): IPv6 literal in the
#          connection address → ipv6 primary, otherwise ipv4 primary
#   ipv4 → IPv4 primary, IPv6 secondary ("IPv6 as an add-on")
#   ipv6 → IPv6 primary, IPv4 secondary (e.g. only private/NATed IPv4 available)
ip_family_primary: "auto"

# Pod (cluster) and service CIDRs per family.
# The IPv4 values match the k3s defaults; the IPv6 values are ULA ranges.
k3s_cluster_cidr_ipv4: "10.42.0.0/16"
k3s_service_cidr_ipv4: "10.43.0.0/16"
k3s_cluster_cidr_ipv6: "fd00:42::/56"
k3s_service_cidr_ipv6: "fd00:43::/112"

# Externally reachable node IP advertised to k3s (--node-external-ip).
# Leave empty ("") to auto-detect it from the address Ansible connects through
# (ansible_host / inventory_hostname) whenever that differs from the host's
# internal interface address (e.g. NAT). Set explicitly only for edge cases.
k3s_node_external_ip: ""

# -----------------------------------------------------------------------------
## 🩺 Preflight: inter-node overlay connectivity check
# -----------------------------------------------------------------------------
# Before installing k3s, verify the flannel overlay port is reachable between
# every pair of nodes in BOTH directions. OpenStack security groups often allow
# SSH/API (TCP) and ICMP but silently drop the VXLAN UDP port — the cluster then
# forms (all nodes Ready) yet cross-node pod traffic is black-holed. The check
# tests the real overlay port with a cooperative listener (a ping would give
# false confidence) and fails early with an actionable message.
#
# Auto-enabled only for multi-node runs (a single node has no peers to test).
# Set to false to skip it, or true to force it on.
preflight_connectivity_check: "{{ (ansible_play_hosts_all | default([]) | length) > 1 }}"

# Overlay UDP port to probe. 0 = auto-detect: 8472 for the default flannel VXLAN
# backend, or 51820 when 'wireguard' appears in k3s_extra_exec_args. Set a fixed
# port for other backends (e.g. 51821 for wireguard-native over IPv6).
preflight_overlay_port: 0

# Seconds each destination node listens while its peers send probes. The default
# is comfortably longer than the senders need; raise it only on very slow links.
preflight_probe_duration: 5

# -----------------------------------------------------------------------------
## 🚀 K3s Node Role
# -----------------------------------------------------------------------------
# Set to "server" for the control-plane node or "agent" for worker nodes.
# Server nodes run the full k3s stack and all add-ons.
# Agent nodes join an existing cluster and skip all add-on installation.
k3s_role: "server"

# For agent nodes: the IP address of the k3s server to join.
# Typically set as a group_var on the agent host group (e.g., k3s_server_host: "1.2.3.4").
# The join token is fetched automatically from the server at runtime.
k3s_server_host: ""

# -----------------------------------------------------------------------------
## 🚀 K3s Server Configuration
# -----------------------------------------------------------------------------
# K3s installation arguments passed to the install script (via INSTALL_K3S_EXEC).
# By default these are computed dynamically in tasks/03_network.yml from the
# selected ip_family/ip_family_primary: --flannel-ipv6-masq when IPv6 is in use,
# and --tls-san, --cluster-cidr, --service-cidr, --node-ip and
# --node-external-ip as needed.
# Set this to a non-empty string only to fully override the computed arguments.
k3s_exec_args: ""

# Extra arguments appended verbatim to the computed k3s server install arguments.
k3s_extra_exec_args: ""

# Standard path where K3s stores the main kubeconfig file on the node.
kubeconfig_root: /etc/rancher/k3s/k3s.yaml

# Destination on the Ansible control node where the server's kubeconfig is
# fetched (full path + filename). Empty = the default per-host name
# "./kubeconfig-<inventory_host>.yaml" (':' in IPv6 hosts sanitized to '_').
# Set to a fixed path to always write the same file — it is overwritten on every
# run. Relative paths are resolved from the playbook directory.
kubeconfig_path: ""

# -----------------------------------------------------------------------------
## ♻️ Add-on: Automated k3s upgrades (system-upgrade-controller)
# -----------------------------------------------------------------------------
# Keep the cluster's k3s version current automatically by deploying Rancher's
# system-upgrade-controller plus two upgrade Plans (one for server, one for agent
# nodes). The controller cordons each node in turn, swaps the k3s binary via a
# privileged job and restarts the service — a controlled rolling upgrade instead
# of "all nodes at once". Server nodes are always upgraded before agents (the
# agent Plan's prepare step waits for the server Plan to finish).
#
# ON by default so clusters stay current on their own. This means the cluster may
# change its k3s version by itself (channel mode, see below) and every node is
# briefly cordoned during an upgrade. By default upgrades only run inside the
# nightly maintenance window (see k3s_auto_upgrade_window_* below), so on a single
# node the unavoidable short downtime happens at 02:00, not mid-day. Set to false
# to opt out entirely (e.g. to pin the version manually in a maintenance window).
# Only deployed on the server node. See https://docs.k3s.io/upgrades/automated.
k3s_auto_upgrade_enabled: true

# Which k3s release the Plans track. Two mutually exclusive modes:
#   channel → follow a release channel (auto-detects new releases; "always
#             current"). The channel name is turned into
#             https://update.k3s.io/v1-release/channels/<channel>.
#   version → pin one exact release (reproducible; you bump it deliberately in
#             Git and the controller rolls it out). Set k3s_auto_upgrade_version
#             to e.g. "v1.31.5+k3s1"; when non-empty it overrides the channel.
# IMPORTANT: never skip an intermediate minor version when pinning — k3s follows
# the Kubernetes version-skew policy and rejects such jumps (and downgrades).
k3s_auto_upgrade_channel: "stable"
k3s_auto_upgrade_version: ""

# Drain (evict pods) instead of only cordoning agent nodes before upgrading them.
# true  → agent Plan drains (force, so DaemonSet/standalone pods don't block it),
#         giving the cleanest in-place upgrade at the cost of pod reschedules.
# false → agent Plan only cordons (workloads keep running through the restart).
# Server nodes are always cordon-only: draining a control-plane node would evict
# the upgrade controller itself and, on a single node, deadlock the upgrade.
k3s_auto_upgrade_drain: true

# Maintenance window: only start upgrade jobs inside this time range. Strongly
# recommended when downtime is unavoidable (e.g. a single node, where every
# upgrade briefly takes the cluster down) so it happens at night, not mid-day.
# The controller only *starts* jobs within the window; keep it long enough for an
# upgrade to begin. Set k3s_auto_upgrade_window_enabled to false to upgrade as
# soon as a new release is detected, at any time.
k3s_auto_upgrade_window_enabled: true
# Full lowercase weekday names; default is every day so a release is never held
# back more than 24h. Trim to e.g. weekends only to widen the gap between upgrades.
k3s_auto_upgrade_window_days:
  - sunday
  - monday
  - tuesday
  - wednesday
  - thursday
  - friday
  - saturday
# 24h "HH:MM" strings, interpreted in the timezone below (not UTC).
k3s_auto_upgrade_window_start: "02:00"
k3s_auto_upgrade_window_end: "04:00"
k3s_auto_upgrade_window_timezone: "Europe/Berlin"

# Namespace the controller and its Plans live in (the upstream manifest creates
# it and the matching "system-upgrade" ServiceAccount the Plans reference).
system_upgrade_namespace: system-upgrade

# system-upgrade-controller release to install. "latest" tracks the newest GitHub
# release; pin a tag (e.g. "v0.16.0") for reproducible installs.
system_upgrade_controller_version: "latest"

# -----------------------------------------------------------------------------
## 🧰 Bootstrap: client / developer tooling
# -----------------------------------------------------------------------------
# Install Helm, kubectl, Skaffold and the shell aliases/completions. These are
# only useful on the server node (agents have no kubeconfig), so they are
# installed there only. Set to false to skip them entirely (lean production node).
bootstrap_install_client_tools: true

# Versions for the tools fetched during bootstrap. Leave Helm/kubectl empty to
# track the latest stable release; pin to a tag (e.g. "v3.16.3" / "v1.31.4") for
# reproducible installs. Skaffold takes "latest" or a release tag (e.g. "v2.13.2").
helm_version: ""
kubectl_version: ""
skaffold_version: "latest"

# -----------------------------------------------------------------------------
## 💾 Add-on: Longhorn (distributed block storage)
# -----------------------------------------------------------------------------
# Install Longhorn for replicated, node-independent volumes. Auto-detects the
# cluster size: ON when this Ansible run targets more than one host (multi-node,
# where the k3s-default local-path storage is node-local and offers no failover),
# OFF on a single node (local-path is enough and replication buys nothing). Set
# explicitly to true or false to override the auto-detection. Longhorn attaches
# volumes via iSCSI on EVERY node and uses NFS for RWX volumes, so open-iscsi +
# nfs-common are installed automatically on all nodes during bootstrap when on.
longhorn_enabled: "{{ (ansible_play_hosts_all | default([]) | length) > 1 }}"
longhorn_namespace: longhorn-system

# Longhorn Helm chart version. Empty = latest from the chart repository; pin a tag
# (e.g. "1.7.2") for reproducible installs.
longhorn_version: ""

# Default number of replicas per volume. Must be <= the number of nodes, otherwise
# replicas stay unscheduled and volumes are "Degraded" (the role asserts this).
# 1 keeps disk usage at 1x (each extra replica is a full copy of the written data,
# so 2 doubles and 3 triples the Longhorn footprint) -- the right default for the
# small lab VMs. It does NOT block the automatic rolling k3s upgrades, because
# longhorn_node_drain_policy below live-migrates the last replica off a node before
# draining it. Raise to 2/3 (<= node count) only when you want redundancy against a
# node *failure* (a crashed node loses its single-replica volumes until restored);
# that is a storage-vs-resilience trade-off, independent of upgrades.
longhorn_replica_count: 1

# Automatically rebalance replicas across nodes when scheduling allows (e.g. after a
# drained node rejoins). Only has an effect at replica counts >= 2. "least-effort"
# spreads replicas without aggressive data movement; "best-effort" balances more
# eagerly; "disabled" leaves placement as-is.
longhorn_replica_auto_balance: least-effort

# Where Longhorn tries to place a replica relative to the workload using the volume.
# "best-effort" keeps one replica on the node the volume is attached to, so normal
# reads and writes stay local instead of crossing the pod network on every I/O --
# what the Longhorn best practices recommend as the default. "disabled" (the chart
# default) makes no such attempt; "strict-local" forces exactly one replica, pinned
# to the workload's node, and is only for applications that replicate themselves.
longhorn_data_locality: best-effort

# What Longhorn does when a node is drained (as the automatic k3s upgrades do). This
# -- not a higher replica count -- is what keeps upgrades from hanging.
# "block-for-eviction-if-contains-last-replica" makes Longhorn live-migrate the last
# healthy replica off the node before allowing the drain, so a rolling upgrade never
# hangs even for single-replica volumes and without a permanent second copy. The
# Longhorn chart default ("block-if-contains-last-replica") instead blocks the drain
# indefinitely (DeadlineExceeded -> node stuck cordoned). Set "always-allow" only if
# you accept temporary volume unavailability during drains.
longhorn_node_drain_policy: block-for-eviction-if-contains-last-replica

# Make Longhorn the cluster's default StorageClass. When true, k3s' built-in
# local-path storage is disabled (via --disable=local-storage on the server) so
# Longhorn is the sole, unambiguous default. When false, local-path stays the
# default and you opt into Longhorn per-PVC via storageClassName: longhorn.
longhorn_default_storage_class: true

# How much storage Longhorn may *reserve* across all volumes, as a percentage of
# each node's disk. Longhorn reserves space by the requested PVC size, not by the
# bytes actually written; since its volumes are thin-provisioned, the reserved
# total can safely exceed the physical disk. The chart default of 100 is tight on
# the small lab VMs (~37 GiB usable/node) and makes larger workloads (e.g. the
# Apache Ozone lab, which requests several volumes) fail to schedule replicas with
# "insufficient storage". 300 gives generous headroom while the separate
# 25%-minimal-available guard still prevents a disk from actually filling up.
# Lower it (e.g. 100) to be conservative on nodes with larger disks.
longhorn_storage_over_provisioning_percentage: 300

# Which orphaned resources Longhorn cleans up on its own, as a semicolon-separated
# list: "replica-data" (replica directories no longer tracked by any volume) and
# "instance" (engine/replica runtime instances left behind when an instance-manager
# dies). Those stale instances are what makes a later attach fail with "connection
# refused" against an instance-manager address that no longer exists. Empty (the
# chart default) means orphans accumulate until deleted by hand. Note that the Helm
# key for this changed name between chart versions and an unknown key under
# defaultSettings is silently ignored -- another reason to pin longhorn_version.
longhorn_orphan_resource_auto_deletion: "replica-data;instance"

# Seconds Longhorn waits before deleting an orphaned resource, giving a node that is
# merely rebooting time to come back and reclaim its replicas. 300 is the Longhorn
# default and is kept explicit here because it is the safety margin on the setting above.
longhorn_orphan_resource_auto_deletion_grace_period: 300

# -----------------------------------------------------------------------------
## 📦 Helm Repository Management
# -----------------------------------------------------------------------------
# Helm Repositories to add on the node before installing any charts.
k3s_role_helm_repos:
  - { name: jetstack, url: https://charts.jetstack.io } # cert-manager chart repository
  - { name: external-dns, url: https://kubernetes-sigs.github.io/external-dns/ } # external-dns

# -----------------------------------------------------------------------------
## 🔒 Add-on: Cert-Manager with ClusterIssuer
# -----------------------------------------------------------------------------

# IMPORTANT: The cert-manager installation and ClusterIssuer tasks will be
# skipped if 'cert_manager_email' is an empty string ("").
# The email address required for ACME account registration (mandatory for Let's Encrypt).
cert_manager_email: "" # e.g., "admin@yourdomain.com"

# The ACME server URL for the ClusterIssuer definition.
# Uses DHBW-internal ACME server (only accessible from within DHBW networks or VPNs)
cert_manager_url: "https://certificates.dhbw.cloud"

cert_manager_private_key_secret_name: "cert-manager-private-key-secret"

# External Account Binding (EAB) details: Required only for specific commercial CAs.
# If EAB is not required, leave both variables as empty strings.
cert_manager_eab_keyid: "" # Optional: The Key ID provided by the external CA
cert_manager_eab_secret: "" # Optional: MAC key (will be stored in a Secret and be base64 encoded there)
cert_manager_eab_secret_name: "cert-manager-eab-secret"

# Namespace in which cert-manager will be deployed
cert_manager_namespace: cert-manager

# Chart version, pinned on purpose. Unpinned, this task installs whatever is
# newest at the moment it runs, so two clusters built at different times end up
# on different versions and nobody decided that: one deployment sat on v1.19.1
# while another had moved to v1.20.3, and the next run would have jumped the
# first one two minor versions in a single step. This is the component that
# issues the wildcard certificate — an upgrade here is worth deciding, not
# inheriting from the calendar. Raise this deliberately, after reading the
# cert-manager release notes for the versions being skipped.
cert_manager_chart_version: "v1.20.3"

# Set to dns01 or http01. dns01 (the default) requires the RFC2136 vars below
# (rfc2136_zone / rfc2136_tsig_secret_value / rfc2136_tsig_secret_alg /
# rfc2136_tsig_secret_keyname); if they are unset the ClusterIssuer silently
# falls back to http01. dns01 is the only challenge that can issue wildcards, so
# selecting it (with a zone set) also enables the wildcard cert below.
cert_manager_preferred_challenge: dns01

# Name of the k8s Secret (in cert_manager_namespace) the role creates to hold the
# RFC2136 TSIG key for the dns01 solver. Only created when dns01 is selected.
cert_manager_rfc2136_tsig_secret_name: "cert-manager-rfc2136-tsig"

# Name of the cert-manager ClusterIssuer this role creates. Reference it from your
# Ingress/IngressRoute (e.g. the cert-manager.io/cluster-issuer annotation) to
# request certificates from it.
cert_manager_cluster_issuer_name: certificate-cluster-issuer

# --- Wildcard certificate + Traefik default TLS store ----------------------
# Whenever dns01 is the active challenge (preferred_challenge=dns01 and the
# RFC2136 vars are set) the role issues a single wildcard certificate covering
# *.<rfc2136_zone> and registers it as Traefik's default TLS store, so Traefik
# serves it for any HTTPS host that has no more-specific certificate. One cert
# replaces the per-host certs. A wildcard matches exactly one label, so
# *.example.com covers a.example.com but NOT the apex example.com nor
# a.b.example.com.
#
# This is additive and non-breaking: existing per-host certs keep winning by
# SNI until you remove their cert-manager.io/cluster-issuer annotations at the
# source (Helm values / CR / manifest) and delete the per-host Certificate
# objects.
#
# Name of the TLS Secret holding the wildcard cert+key. Created by cert-manager
# in traefik_namespace so Traefik (and the default TLSStore) can read it.
cert_manager_wildcard_secret_name: "wildcard-tls"

# Namespace Traefik runs in (k3s bundles Traefik in kube-system). The wildcard
# Secret and the default TLSStore must live here for Traefik to use them.
traefik_namespace: kube-system

# -----------------------------------------------------------------------------
## 🌐 Add-on: External DNS
# -----------------------------------------------------------------------------

external_dns_namespace: external-dns

# ExternalDNS container image tag. Do not go below v0.21.0: up to and including
# v0.20.0 a transient AXFR failure (e.g. a TCP/53 timeout towards the RFC2136
# server) bubbled up as a hard error, so the controller called log.Fatalf and the
# pod crash-looped. Since v0.21.0 the rfc2136 provider wraps it in a SoftError,
# which the controller logs and retries on the next interval.
external_dns_version: "v0.21.0"

# ExternalDNS Helm chart version. Empty = latest from the chart repository; pin a
# version for reproducible installs. Keep this in sync with the image tag above
# (chart 1.21.1 ships appVersion 0.21.0) — an unpinned chart combined with a
# pinned image silently drifts into untested combinations.
external_dns_chart_version: "1.21.1"

external_dns_log_level: "debug"

# Reconciliation interval. Every run pulls a FULL TSIG AXFR of the zone, so with
# many clusters publishing into one shared zone this is the dominant load on the
# RFC2136 server — the chart default of 1m means one zone transfer per cluster per
# minute. 5m cuts that fivefold without making record creation slower, because
# external_dns_trigger_loop_on_event reacts to source changes immediately; the
# interval is then only the safety net against missed events and drift.
external_dns_interval: "5m"

# Reconcile on source events (--events) instead of only on the interval. Both
# sources in use support it (the ingress and traefik-proxy sources register
# informer event handlers), so a new Ingress or IngressRoute still gets its DNS
# record within seconds despite the longer interval above.
external_dns_trigger_loop_on_event: true

# Registry (TXT record) ownership. external-dns uses TXT records to track the
# records it manages. Make the owner ID unique per cluster when several clusters
# publish into the same zone, otherwise they fight over each other's records.
external_dns_txt_owner_id: dynamic-zones-dns
external_dns_txt_prefix: dynamic-zones-dns-

# RFC2136 DNS server address (also the nameserver for the cert-manager dns01 solver),
# used when rfc2136_zone is set. Defaults to the DHBW dynamic-DNS server; override for
# other environments (set to "" to disable when no RFC2136 zone is configured).
rfc2136_dns_host: "141.72.5.244"
rfc2136_dns_port: 53

# Target networks external-dns must never publish to public DNS. Ingress/Service
# status often lists every node address, including private/NAT ranges (e.g. the
# IPv4 NAT addresses on a dual-stack cluster). These are excluded so only the
# publicly routable targets (e.g. the global IPv6 addresses) become DNS records.
external_dns_exclude_target_nets:
  - 10.0.0.0/8 # RFC1918
  - 172.16.0.0/12 # RFC1918
  - 192.168.0.0/16 # RFC1918
  - 100.64.0.0/10 # CGNAT (RFC6598)
  - 169.254.0.0/16 # IPv4 link-local
  - fc00::/7 # IPv6 ULA
  - fe80::/10 # IPv6 link-local
# rfc2136_zone: your-zone.example.com
# rfc2136_tsig_secret_value: some_value
# rfc2136_tsig_secret_alg: hmac-sha512
# rfc2136_tsig_secret_keyname: user-key-xxxx
